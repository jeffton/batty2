<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h, ref } from "vue";
      import ChatTranscript from "./ChatTranscript.vue";
      import { buildTranscriptDisplayEntries } from "../lib/transcript-display.ts";
      import "../styles.css";

      const expanded = ref(false);
      const working = ref(false);
      const answer = ref("Short answer");
      const location = ref("tail");
      const tools = new Map();
      document.addEventListener("fixture-reply", (event) => {
        answer.value = event.detail.text;
        location.value = event.detail.location ?? "tail";
      });
      document.addEventListener("fixture-working", (event) => {
        working.value = event.detail;
      });
      createApp({
        setup() {
          return () => {
            const messages = [
              { id: "u", role: "user", timestamp: 1, blocks: [{ type: "text", text: "Question" }] },
              {
                id: "a",
                role: "assistant",
                timestamp: 2,
                turnPhase: "final",
                blocks: [
                  { type: "thinking", thinking: "Work details" },
                  { type: "text", text: answer.value },
                ],
              },
            ];
            const entries = buildTranscriptDisplayEntries(
              messages.map((message) => ({ message, toolStatesByCallId: tools })),
              tools,
              {
                openDetailsSectionKey: expanded.value ? "turn:u" : null,
                isStreaming: working.value,
              },
            ).entries;
            return h(ChatTranscript, {
              historyEntries: location.value === "history" ? entries : [],
              tailEntries: location.value === "tail" ? entries : [],
              keptHistoryIndexes: [],
              isStreaming: working.value,
              isPinnedToBottom: true,
              onToggleDetails: () => {
                expanded.value = !expanded.value;
              },
            });
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
